apply plugin: 'com.android.application'

android {
    namespace = 'rkr.simplekeyboard.inputmethod'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.hyouka56.blackofflinekeyboard'
        minSdk = 24
        targetSdk = 36
        versionCode = 148
        versionName = '6.7'

        // Package native code for ARM64 devices only.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // This module contains Java sources only; avoid creating Kotlin compiler tasks.
    enableKotlin = false

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
}

// Report exact deprecated Java API call sites instead of only a generic compiler note.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
