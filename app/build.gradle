apply plugin: 'com.android.application'

// Production APKs stay ARM64-only. CI can select x86_64 solely to run the IME
// visibility test on the hosted Android emulator.
def keyboardAbi = (project.findProperty('keyboardAbi') ?: 'arm64-v8a').toString()
if (!(keyboardAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException("Unsupported keyboardAbi: " + keyboardAbi)
}

android {
    namespace = 'rkr.simplekeyboard.inputmethod'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.hyouka56.blackofflinekeyboard'
        minSdk = 24
        targetSdk = 36
        versionCode = 148
        versionName = '6.7'
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'

        // Package native code for ARM64 devices only.
        ndk {
            abiFilters keyboardAbi
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // This module contains Java sources only; avoid creating Kotlin compiler tasks.
    enableKotlin = false

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
}

// Report exact deprecated Java API call sites instead of only a generic compiler note.
tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
