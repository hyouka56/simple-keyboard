name: Android build and privacy checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify source privacy and language constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.INTERNET' not in manifest, 'Internet permission found'
          assert 'android.permission.VIBRATE' not in manifest, 'Vibration permission found'
          assert 'android:allowBackup="false"' in manifest, 'Backups must remain disabled'

          locale_source = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/utils/SubtypeLocaleUtils.java').read_text()
          match = re.search(r'sSupportedLocales\s*=\s*new String\[\]\s*\{(.*?)\};', locale_source, re.S)
          assert match, 'Could not locate supported locale allowlist'
          locales = re.findall(r'LOCALE_[A-Z0-9_]+', match.group(1))
          assert locales == [
              'LOCALE_ENGLISH_UNITED_STATES',
              'LOCALE_ENGLISH_GREAT_BRITAIN',
              'LOCALE_ENGLISH_INDIA',
              'LOCALE_ARABIC',
          ], f'Unexpected input language allowlist: {locales}'
          assert 'if (!isAllowedLocale(locale))' in locale_source, 'Locale guard missing'

          for file in ('app/src/main/res/values/colors.xml', 'app/src/main/res/values-night/colors.xml'):
              root = ET.parse(file).getroot()
              colors = {e.attrib.get('name'): (e.text or '').strip().lower() for e in root.findall('color')}
              required = ['background_lxx_system', 'background_secondary_lxx_system']
              if file.endswith('/values/colors.xml'):
                  required += ['background_lxx_light', 'background_secondary_lxx_light', 'background_lxx_dark', 'background_secondary_lxx_dark']
              for name in required:
                  assert colors.get(name) == '#000000', f'{file}: {name} must be #000000'

          assert 'pref_keyboard_color' not in Path('app/src/main/res/xml/prefs_screen_appearance.xml').read_text(), 'Custom keyboard colour UI must stay removed'

          keypress_root = ET.parse('app/src/main/res/xml/prefs_screen_key_press.xml').getroot()
          keypress_prefs = {e.attrib.get('{http://schemas.android.com/apk/res/android}key'): e for e in keypress_root}
          for key in ('sound_on', 'pref_keypress_sound_volume', 'popup_on', 'pref_key_longpress_timeout'):
              pref = keypress_prefs.get(key)
              assert pref is not None and pref.attrib.get('{http://schemas.android.com/apk/res/android}enabled') == 'false', f'Keypress preference {key} must stay disabled'

          general_root = ET.parse('app/src/main/res/xml/prefs_screen_preferences.xml').getroot()
          general_prefs = {e.attrib.get('{http://schemas.android.com/apk/res/android}key'): e for e in general_root}
          language_key = 'pref_show_language_switch_key'
          assert language_key in general_prefs and general_prefs[language_key].attrib.get('{http://schemas.android.com/apk/res/android}enabled') == 'true', 'Language-switch toggle must remain enabled'
          for key in ('auto_cap', 'pref_show_number_row', 'pref_show_special_chars', 'pref_use_on_screen', 'pref_enable_ime_switch', 'pref_space_swipe', 'pref_delete_swipe'):
              pref = general_prefs.get(key)
              assert pref is not None and pref.attrib.get('{http://schemas.android.com/apk/res/android}enabled') == 'false', f'Preference {key} must stay disabled'

          for file in ('app/src/main/res/values/colors.xml', 'app/src/main/res/values-night/colors.xml'):
              root = ET.parse(file).getroot()
              colors = {e.attrib.get('name'): (e.text or '').strip().lower() for e in root.findall('color')}
              for name in ('key_background_normal_lxx_system', 'key_background_pressed_lxx_system'):
                  assert colors.get(name) == '#ff000000', f'{file}: {name} must be opaque pure black'
              assert colors.get('key_text_color_lxx_system') == '#ffffffff', f'{file}: keyboard labels must remain readable on black'

          manager = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/AudioAndHapticFeedbackManager.java').read_text()
          assert 'mVibrator' not in manager and 'VibrationEffect' not in manager, 'Vibration implementation found'
          print('Source privacy, black background, and Arabic/English checks passed.')
          PY

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify final APK permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          if grep -Eq 'android\.permission\.(INTERNET|VIBRATE)' apk-permissions.txt; then
            echo 'Forbidden Internet or vibration permission found in the built APK.' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: black-offline-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Smoke-test settings screens on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            PKG=com.hyouka56.blackofflinekeyboard
            COMPONENT="$PKG/rkr.simplekeyboard.inputmethod.latin.settings.SettingsActivity"
            mkdir -p test-results
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            test_screen() {
              name="$1"
              fragment="$2"
              adb shell am force-stop "$PKG" || true
              adb logcat -c
              if [ "$fragment" = "default" ]; then
                adb shell am start -W -n "$COMPONENT"
              else
                adb shell am start -W -n "$COMPONENT" --es :android:show_fragment "$fragment"
              fi
              sleep 2
              adb logcat -d -b crash -v time > "test-results/${name}-crash.log" || true
              adb logcat -d -s AndroidRuntime:E -v time >> "test-results/${name}-crash.log" || true
              if grep -Eq 'FATAL EXCEPTION|Unable to start activity|Process: com\.hyouka56\.blackofflinekeyboard' "test-results/${name}-crash.log"; then
                adb logcat -d -v time > "test-results/${name}-full-logcat.txt" || true
                echo "Crash detected while opening ${name}; logcat saved." >&2
                exit 1
              fi
              adb shell uiautomator dump "/sdcard/${name}-window.xml" >/dev/null
              adb pull "/sdcard/${name}-window.xml" "test-results/${name}-window.xml" >/dev/null
              grep -q "$PKG" "test-results/${name}-window.xml"
              echo "PASS: ${name} opened without AndroidRuntime crash."
            }

            test_screen settings default
            test_screen keypress rkr.simplekeyboard.inputmethod.latin.settings.KeyPressSettingsFragment
            test_screen preferences rkr.simplekeyboard.inputmethod.latin.settings.PreferencesSettingsFragment
            test_screen appearance rkr.simplekeyboard.inputmethod.latin.settings.AppearanceSettingsFragment

      - name: Upload settings smoke-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-smoke-test-results
          path: test-results/
          if-no-files-found: ignore
