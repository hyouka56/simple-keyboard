name: Android build and privacy checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Set Git default branch name
        run: git config --global init.defaultBranch master

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          LICENSE_ACCEPTANCES="$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --licenses <<< "$LICENSE_ACCEPTANCES" >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify source privacy and language constraints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.INTERNET' not in manifest, 'Internet permission found'
          assert 'android.permission.VIBRATE' not in manifest, 'Vibration permission found'
          assert 'android:allowBackup="false"' in manifest, 'Backups must remain disabled'

          android_ns = '{http://schemas.android.com/apk/res/android}'
          manifest_root = ET.fromstring(manifest)
          application = manifest_root.find('application')
          assert application is not None, 'Application element is missing'
          ime_service = next((component for component in application.findall('service') if component.attrib.get(android_ns + 'name') == '.latin.LatinIME'), None)
          assert ime_service is not None, 'Keyboard input-method service must remain declared'
          assert ime_service.attrib.get(android_ns + 'exported') == 'false', 'Keep the verified keyboard service visibility setting so Android registers the IME'
          assert ime_service.attrib.get(android_ns + 'permission') == 'android.permission.BIND_INPUT_METHOD', 'Input-method service must remain protected by BIND_INPUT_METHOD'
          assert not any('SettingsActivity' in component.attrib.get(android_ns + 'name', '') for component in application.findall('activity')), 'Settings Activity must stay removed'
          for component in application:
              for intent_filter in component.findall('intent-filter'):
                  actions = {node.attrib.get(android_ns + 'name') for node in intent_filter.findall('action')}
                  categories = {node.attrib.get(android_ns + 'name') for node in intent_filter.findall('category')}
                  assert not ('android.intent.action.MAIN' in actions and 'android.intent.category.LAUNCHER' in categories), 'Launcher UI must stay removed'
          input_method_xml = ET.parse('app/src/main/res/xml/method.xml').getroot()
          assert android_ns + 'settingsActivity' not in input_method_xml.attrib, 'Input method must not advertise an in-app settings screen'
          latin_ime_source = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/LatinIME.java').read_text()
          assert 'SettingsActivity' not in latin_ime_source, 'Keyboard must not launch the removed Settings Activity'
          keyboard_texts = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/keyboard/internal/KeyboardTextsTable.java').read_text()
          assert '/* keyspec_settings */ "!icon/paste_key|!code/key_paste"' in keyboard_texts, 'Long-press popup must retain paste but not the settings gear'
          common_key_styles = Path('app/src/main/res/xml/key_styles_common.xml').read_text()
          assert 'latin:styleName="deleteKeyStyle"' in common_key_styles and 'latin:keySpec="!icon/delete_key|!code/key_delete"' in common_key_styles, 'Delete key must remain available'

          removed_settings_ui = [
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/AppearanceSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/ColorDialogPreference.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/InputMethodSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/InputMethodSettingsImpl.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/KeyPressSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/LanguagesSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/PreferencesSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/RadioButtonPreference.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/SeekBarDialogPreference.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/SettingsActivity.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/SettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/SingleLanguageSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/SubScreenFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/ThemeSettingsFragment.java',
              'app/src/main/java/rkr/simplekeyboard/inputmethod/latin/utils/FragmentUtils.java',
              'app/src/main/res/xml/prefs.xml',
              'app/src/main/res/xml/prefs_screen_appearance.xml',
              'app/src/main/res/xml/prefs_screen_key_press.xml',
              'app/src/main/res/xml/prefs_screen_preferences.xml',
              'app/src/main/res/xml/prefs_screen_theme.xml',
              'app/src/main/res/xml/empty_settings.xml',
          ]
          assert all(not Path(path).exists() for path in removed_settings_ui), 'Standalone settings UI source/resources must stay removed'
          keyboard_codes = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/keyboard/internal/KeyboardCodesSet.java').read_text()
          assert 'key_settings' not in keyboard_codes and 'CODE_SETTINGS' not in keyboard_codes, 'Settings key code must be removed'
          for key_resource in [
              'app/src/main/res/xml/key_styles_common.xml',
              'app/src/main/res/xml-sw600dp/key_styles_common.xml',
              'app/src/main/res/xml/row_pcqwerty5.xml',
              'app/src/main/res/xml-sw600dp/row_pcqwerty5.xml',
              'app/src/main/res/xml/row_hcesar4.xml',
          ]:
              content = Path(key_resource).read_text()
              assert 'settingsKeyStyle' not in content and '!code/key_settings' not in content and '!icon/settings_key' not in content, f'{key_resource}: settings gear must stay removed'
          assert not Path('app/src/main/res/drawable/sym_keyboard_settings.xml').exists(), 'Settings gear drawable must stay removed'
          appname_strings = Path('app/src/main/res/values/strings-appname.xml').read_text()
          assert 'privacy_policy_url' not in appname_strings and 'license_url' not in appname_strings, 'External URL resources must stay removed'
          for strings_file in Path('app/src/main/res').glob('values*/strings.xml'):
              content = strings_file.read_text()
              assert not re.search(r'<string\s+name="(?:privacy_policy|license)"', content), f'{strings_file}: removed legal-link label still exists'

          locale_source = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/utils/SubtypeLocaleUtils.java').read_text()
          match = re.search(r'sSupportedLocales\s*=\s*new String\[\]\s*\{(.*?)\};', locale_source, re.S)
          assert match, 'Could not locate supported locale allowlist'
          locales = re.findall(r'LOCALE_[A-Z0-9_]+', match.group(1))
          assert locales == [
              'LOCALE_ENGLISH_UNITED_STATES',
              'LOCALE_ARABIC',
          ], f'Expected exactly Arabic and English (US): {locales}'
          assert 'if (!isAllowedLocale(locale))' in locale_source, 'Locale guard missing'
          subtype_manager = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/RichInputMethodManager.java').read_text()
          assert 'SubtypeLocaleUtils.getSupportedLocales().contains(subtype.getLocale())' in subtype_manager, 'Saved legacy locales must be filtered during migration'
          restriction_strings = Path('app/src/main/res/values/strings.xml').read_text()
          assert 'en_US:qwerty;ar:arabic' in restriction_strings and 'de:qwertz' not in restriction_strings, 'Managed-device locale list must contain only English and Arabic'

          for file in (
              'app/src/main/res/values/colors.xml',
              'app/src/main/res/values-night/colors.xml',
              'app/src/main/res/values-v31/colors.xml',
              'app/src/main/res/values-night-v31/colors.xml',
          ):
              root = ET.parse(file).getroot()
              colors = {e.attrib.get('name'): (e.text or '').strip().lower() for e in root.findall('color')}
              backgrounds = ['background_lxx_system', 'background_secondary_lxx_system']
              for name in backgrounds:
                  assert colors.get(name) == '#000000', f'{file}: {name} must be #000000'
              for name in ('key_background_normal_lxx_system', 'key_background_pressed_lxx_system'):
                  assert colors.get(name) == '#ff000000', f'{file}: {name} must be opaque black'
              if file.endswith('/values/colors.xml'):
                  for name in ('background_lxx_light', 'background_secondary_lxx_light', 'background_lxx_dark', 'background_secondary_lxx_dark'):
                      assert colors.get(name) == '#000000', f'{file}: {name} must be #000000'
              for name in ('key_text_color_lxx_system', 'key_functional_text_color_lxx_system'):
                  assert colors.get(name) == '#ffffffff', f'{file}: {name} must remain readable on black'
          settings_source = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/Settings.java').read_text()
          assert 'return prefs.getInt(PREF_KEYBOARD_COLOR, readKeyboardDefaultColor(context));' in settings_source, 'Keyboard color preference must persist and fall back to the theme default'
          assert 'return prefs.getBoolean(PREF_SHOW_LANGUAGE_SWITCH_KEY, true);' in settings_source, 'Language-switch key preference default must stay enabled'
          assert 'return prefs.getBoolean(PREF_ENABLE_IME_SWITCH, false);' in settings_source, 'IME-switch preference default must stay disabled'
          assert 'return prefs.getBoolean(PREF_SHOW_NUMBER_ROW, false);' in settings_source, 'Number-row default must stay disabled'
          assert 'return prefs.getBoolean(PREF_SPACE_SWIPE, false);' in settings_source, 'Space-swipe default must stay disabled'
          assert 'return prefs.getBoolean(PREF_DELETE_SWIPE, false);' in settings_source, 'Delete-swipe default must stay disabled'
          keyboard_settings_source = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/settings/SettingsValues.java').read_text()
          assert 'mAutoCap = prefs.getBoolean(Settings.PREF_AUTO_CAP, true);' in keyboard_settings_source, 'Auto-capitalization preference must remain part of keyboard runtime settings'
          assert 'mShowsLanguageSwitchKey = Settings.readShowLanguageSwitchKey(prefs);' in keyboard_settings_source, 'Language-switch configuration must remain runtime-controlled'
          assert 'mKeyboardHeightScale = Settings.readKeyboardHeight(prefs, DEFAULT_SIZE_SCALE);' in keyboard_settings_source, 'Keyboard height preference must remain available to runtime'
          keyboard_theme_source = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/keyboard/KeyboardTheme.java').read_text()
          assert 'new KeyboardTheme(THEME_ID_SYSTEM, "LXXSystem", R.style.KeyboardTheme_LXX_System, true)' in keyboard_theme_source, 'System keyboard theme must remain the default'
          platform_theme = Path('app/src/main/res/values/platform-theme.xml').read_text()
          assert 'name=\"platformDialogTheme\"' in platform_theme, 'Input-method picker dialog theme must remain available'
          assert 'name=\"platformSettingsTheme\"' not in platform_theme, 'Standalone settings-window theme must stay removed'
          assert '<item name=\"android:colorBackground\">#000000</item>' in platform_theme, 'Dialog background must remain pure black'
          assert '<item name=\"android:windowBackground\">#000000</item>' in platform_theme, 'Dialog window background must remain pure black'
          assert not Path('app/src/main/res/xml/prefs_screen_appearance.xml').exists(), 'Appearance preference screen must stay removed'

          for file in ('app/src/main/res/values/colors.xml', 'app/src/main/res/values-night/colors.xml'):
              root = ET.parse(file).getroot()
              colors = {e.attrib.get('name'): (e.text or '').strip().lower() for e in root.findall('color')}
              for name in ('key_background_normal_lxx_system', 'key_background_pressed_lxx_system'):
                  assert colors.get(name) == '#ff000000', f'{file}: {name} must be opaque pure black'
              assert colors.get('key_text_color_lxx_system') == '#ffffffff', f'{file}: keyboard labels must remain readable on black'

          manager = Path('app/src/main/java/rkr/simplekeyboard/inputmethod/latin/AudioAndHapticFeedbackManager.java').read_text()
          assert 'mVibrator' not in manager and 'VibrationEffect' not in manager, 'Vibration implementation found'
          print('Source privacy, black background, and Arabic/English checks passed.')
          PY

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Build debug APK
        run: gradle --no-daemon --warning-mode=all --stacktrace assembleDebug

      - name: Verify final APK permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee apk-permissions.txt
          if grep -Eq 'android\.permission\.(INTERNET|VIBRATE)' apk-permissions.txt; then
            echo 'Forbidden Internet or vibration permission found in the built APK.' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: black-offline-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
